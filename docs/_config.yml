# GitHub Pages site, built by GitHub from the docs/ folder of the main branch.
title: adk-kanode
tagline: Run Google ADK Workflow nodes and agents in their own Kubernetes pods, with one decorator.
description: >-
  adk-kanode is a Python plugin for the Google Agent Development Kit (ADK). One
  @kanode decorator runs an ADK Workflow node or agent in its own Kubernetes /
  GKE pod, including gVisor pods on GKE Sandbox.
url: https://benmizrahi.github.io
baseurl: /adk-kanode
lang: en
author:
  name: Ben Mizrahi
  url: https://github.com/benmizrahi

# The page uses its own layout and stylesheet (docs/_layouts, docs/assets/css).
repo_url: https://github.com/benmizrahi/adk-kanode

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Social preview image used by search engines and link previews.
image: /assets/social-preview.png

# To verify the site in Google Search Console, choose the "HTML tag" method and
# put the content value of the tag here:
# webmaster_verifications:
#   google: "<verification code>"

# ARCHITECTURE.md is written for GitHub (Mermaid diagrams); the site links to it there.
exclude:
  - ARCHITECTURE.md
