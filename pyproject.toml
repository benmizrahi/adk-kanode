[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-kanode"
version = "1.0.0"
description = "ADK Workflow plugin and decorator (@kanode) for running workflow nodes in dedicated GKE/Kubernetes pods"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.14.1",
    "httpx>=0.27.0",
    "kubernetes>=30.1.0",
]
keywords = ["adk", "google-adk", "agents", "workflow", "kubernetes", "gke"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/benmizrahi/adk-kanode"
Repository = "https://github.com/benmizrahi/adk-kanode"
Issues = "https://github.com/benmizrahi/adk-kanode/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adk_kanode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

