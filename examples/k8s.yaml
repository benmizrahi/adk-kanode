# Workflow host for the examples: ServiceAccounts, RBAC, and an `adk web` Deployment.
# Build and push the image first (see the example's README), then:
#   envsubst < examples/k8s.yaml | kubectl apply -f -
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adk-workflow-sa
  namespace: ${ADK_K8S_NAMESPACE}
---
# Workers (the @kanode Deployments / pods) run as this account, which has no API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adk-worker-sa
  namespace: ${ADK_K8S_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adk-pod-spawner-role
  namespace: ${ADK_K8S_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status", "pods/log"]
    verbs: ["get"]
  # Deployment mode: one warm Deployment + ClusterIP Service per @kanode.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "patch"]
  # Shared bearer token that authenticates the workflow host to its workers.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["adk-kanode-worker-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adk-pod-spawner-binding
  namespace: ${ADK_K8S_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: adk-workflow-sa
    namespace: ${ADK_K8S_NAMESPACE}
roleRef:
  kind: Role
  name: adk-pod-spawner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-web-example
  namespace: ${ADK_K8S_NAMESPACE}
  labels:
    app: adk-web-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adk-web-example
  template:
    metadata:
      labels:
        app: adk-web-example
    spec:
      serviceAccountName: adk-workflow-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adk-web
          image: ${ADK_K8S_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ADK_K8S_IN_CLUSTER
              value: "true"
            - name: ADK_K8S_IMAGE
              value: "${ADK_K8S_IMAGE}"
            # Workers pull the image on every start. Without this they reuse the copy
            # cached on their node, so a rebuilt image pushed under the same tag is ignored.
            - name: ADK_K8S_IMAGE_PULL_POLICY
              value: "Always"
            - name: ADK_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADK_K8S_SERVICE_ACCOUNT
              value: "adk-worker-sa"
            # "deployment" (warm worker per node, fast) or "pod" (fresh pod per call)
            - name: ADK_K8S_MODE
              value: "deployment"
            # Gemini via Vertex AI, for examples with LLM nodes (the example forwards these to its workers).
            # The worker authenticates with Workload Identity as adk-worker-sa.
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${GOOGLE_CLOUD_PROJECT}"
            - name: GOOGLE_CLOUD_LOCATION
              value: "${GOOGLE_CLOUD_LOCATION}"
            - name: ADK_K8S_CPU_REQUEST
              value: "250m"
            - name: ADK_K8S_MEMORY_REQUEST
              value: "256Mi"
            - name: ADK_K8S_MEMORY_LIMIT
              value: "512Mi"
            - name: ADK_K8S_CLEANUP_POD
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: adk-web-example-svc
  namespace: ${ADK_K8S_NAMESPACE}
  labels:
    app: adk-web-example
spec:
  type: LoadBalancer
  selector:
    app: adk-web-example
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
