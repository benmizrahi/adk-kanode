apiVersion: v1
kind: Namespace
metadata:
  name: ${SUBSTRATE_ATESPACE}
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: adk-kanode-memory
  namespace: ${SUBSTRATE_ATESPACE}
  labels:
    workload: adk-kanode-memory
spec:
  replicas: 2
  workerImage: ${SUBSTRATE_WORKER_IMAGE}
  sandboxClasses:
    - name: gvisor
  template:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
